[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sciagg-ru"
version = "0.1.0"
description = "Reproducible bibliographic aggregation for a Russian master's assignment"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "openpyxl>=3.1,<4", "pypdf>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
sciagg = "sciagg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires network and may require credentials"]
addopts = "-m 'not live' --basetemp=data/pytest-local -p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
